name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          test -f index.html
          test -f README.md

      - name: Check index.html displays "Example Website"
        run: grep -q "<h1>Example Website</h1>" index.html
